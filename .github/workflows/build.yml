name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5

    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        # The test project is multi-targeted (net8.0;net9.0;net10.0), so dotnet test actually runs
        # a separate test host per TFM - all three runtimes must be installed, not just the SDK's
        # own major version, or the net8.0/net9.0 runs fail to launch on a runner that doesn't
        # already happen to have them preinstalled.
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Build project
      run: dotnet build HealthCheckPlus.sln -c Release

    - name: Run test cases
      run: dotnet test -c Release --no-build
